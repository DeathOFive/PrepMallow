plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saaimsohail.prepmallow'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.saaimsohail.prepmallow.mobile'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        resValue 'string', 'app_name', 'PrepMallow'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/prepmallow/assets"))
    }
}

def workspace = rootProject.layout.projectDirectory.dir("web")
def workspaceAssets = layout.buildDirectory.dir("generated/prepmallow/assets/workspace")
def bundleWorkspace = tasks.register("bundleWorkspace", Exec) {
    workingDir(workspace.asFile)
    inputs.dir(workspace.dir("src"))
    inputs.dir(workspace.dir("public"))
    inputs.files(workspace.file("build.mjs"), workspace.file("package.json"), workspace.file("package-lock.json"))
    outputs.dir(workspaceAssets)
    commandLine("node", "build.mjs", workspaceAssets.get().asFile.absolutePath)
}
tasks.named("preBuild").configure { dependsOn(bundleWorkspace) }
